# Explicitly isolated local billing tests. Never deploy this configuration.
name = "k9-billing-local"
pages_build_output_dir = "dist"
compatibility_date = "2025-05-01"

[vars]
APP_URL = "http://localhost:8792"
PADDLE_ENVIRONMENT = "sandbox"
PADDLE_CHECKOUT_ENABLED = "false"
BILLING_V2_ENABLED = "true"
LOCAL_DEV_FULL_ACCESS = "false"

[[d1_databases]]
binding = "DB"
database_name = "k9_billing_local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
remote = false